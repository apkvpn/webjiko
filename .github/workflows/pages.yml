name: Deploy webjiko to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Social preview image
        run: convert -background none -density 96 public/og.svg -resize 1200x630 public/og.jpg || true
      - name: Apply compact theme
        run: node apply-theme.mjs
      - name: Apply English links
        run: node apply-slug.mjs
      - name: Apply manual link field and panel minimize
        run: node apply-editor.mjs
      - name: Apply new layout and assets
        run: node apply-layout.mjs
      - name: Apply post status, related posts, 404 and contact page
        run: node apply-posts.mjs
      - name: Apply editor v2 (status, schedule, guard)
        run: node apply-editor2.mjs
      - name: Apply cover meta (og:image from featured image)
        run: node apply-cover.mjs
      - name: Apply featured image picker
        run: node apply-coverpick.mjs
      - name: Build static site
        run: node build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://apkvpn.github.io/webjiko/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
